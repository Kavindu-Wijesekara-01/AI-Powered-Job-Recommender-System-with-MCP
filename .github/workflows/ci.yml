name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install "dvc[gdrive]" pytest

    - name: Configure DVC credentials and Pull Models
      env:
        # මෙතනට තමයි අපි අර පස්සේ හදන Service Account JSON එක එන්නේ
        GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
      run: |
        if [ -n "$GDRIVE_CREDENTIALS_DATA" ]; then
          # Service Account එකෙන් Google Drive එකට connect වෙන්න config කරනවා
          dvc remote modify gdrive --local gdrive_service_account_json_file_path /dev/stdin <<< "$GDRIVE_CREDENTIALS_DATA"
          
          # Drive එකෙන් ලොකු model files ටික download කරගන්නවා
          dvc pull
        else
          echo "Warning: GDRIVE_CREDENTIALS_DATA secret is not set. Skipping DVC pull."
          echo "Your tests might fail if they require the model files."
        fi

    - name: Run Tests
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      run: |
        # දැනට proper unit tests නැති නිසා Code එකේ Syntax Errors තියෙනවද කියලා විතරක් බලනවා
        export PYTHONPATH=./api
        python -m py_compile api/main.py
