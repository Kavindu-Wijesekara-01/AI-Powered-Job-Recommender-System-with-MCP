version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: job_recommender_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app
    networks:
      - mlops_network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: job_recommender_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./ui:/app
    depends_on:
      - api
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge